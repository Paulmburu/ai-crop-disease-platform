# Runs the platform locally. Later phases add services here.
#   docker compose up --build
#   curl http://localhost:8000/ready     # ML service (needs a checkpoint in python-ml-service/models/)
#   curl http://localhost:8001/ready     # RAG service (needs the Ollama app running on the host)
#   curl http://localhost:8080/ready     # go-backend (diagnosis sync, model releases, advice)
services:
  ml-service:
    build: ./python-ml-service
    ports:
      - "8000:8000"
    volumes:
      # Read-only mount of the checkpoint copied from ml-training (see python-ml-service/README.md).
      - ./python-ml-service/models:/app/models:ro
    environment:
      LOG_LEVEL: INFO
      MODEL_VERSION: v1
    restart: unless-stopped

  rag-service:
    build: ./rag-service
    ports:
      - "8001:8001"
    volumes:
      # The vector index persists across restarts; it is built automatically on first start.
      - rag-index:/data/chroma
    environment:
      LOG_LEVEL: INFO
      # Ollama runs on the host so it can use the Mac GPU; Docker cannot.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_MODEL: llama3.1:8b
    extra_hosts:
      # Docker Desktop defines host.docker.internal already; this makes it work on Linux too.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crop
      POSTGRES_PASSWORD: crop        # local development only
      POSTGRES_DB: crop
    ports:
      - "5433:5432"   # 5433 on the host: avoids clashing with a locally installed PostgreSQL
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crop -d crop"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  go-backend:
    build: ./go-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://crop:crop@postgres:5432/crop?sslmode=disable
      API_KEYS: dev-key               # local development only
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  rag-index:
  pg-data:
