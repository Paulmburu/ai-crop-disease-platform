include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - designs/**
linter:
  rules:
    public_member_api_docs: false   # app code, not a published package
    one_member_abstracts: false     # ports (DDD) are interfaces, even with one method
    specify_nonobvious_property_types: false  # Riverpod family providers have unnameable types
